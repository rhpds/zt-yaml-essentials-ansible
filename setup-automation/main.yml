---
# Setup automation orchestrator
# This playbook is executed by Zero Touch to set up the lab environment.
# It copies and runs host-specific setup scripts.

- name: Create inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add host1 to inventory
      ansible.builtin.add_host:
        name: host1
        ansible_host: "{{ lookup('env', 'HOST1_HOST') | default('host1', true) }}"
        ansible_port: "{{ lookup('env', 'HOST1_PORT') | default('22', true) }}"
        ansible_user: "{{ lookup('env', 'HOST1_USER') | default('rhel', true) }}"
        ansible_ssh_pass: "{{ lookup('env', 'HOST1_PASSWORD') | default('ansible123!', true) }}"
        ansible_become_password: "{{ lookup('env', 'HOST1_PASSWORD') | default('ansible123!', true) }}"
        groups: lab_hosts

- name: Run setup scripts on lab hosts
  hosts: all:!localhost
  gather_facts: false
  tasks:
    - name: Wait for SSH to be available
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 5

    - name: Check if setup script exists for this host
      delegate_to: localhost
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/setup-{{ inventory_hostname }}.sh"
      register: setup_script

    - name: Display setup script status
      ansible.builtin.debug:
        msg: "Setup script for {{ inventory_hostname }}: {{ 'found' if setup_script.stat.exists else 'not found' }}"

    - name: Copy setup script to host
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/setup-{{ inventory_hostname }}.sh"
        dest: "/tmp/setup-{{ inventory_hostname }}.sh"
        mode: '0755'
      when: setup_script.stat.exists
      become: true

    - name: Execute setup script
      ansible.builtin.shell: |
        /tmp/setup-{{ inventory_hostname }}.sh 2>&1 | tee /var/log/setup-{{ inventory_hostname }}.log
      become: true
      register: setup_output
      when: setup_script.stat.exists

    - name: Display setup output
      ansible.builtin.debug:
        var: setup_output.stdout_lines
      when: setup_script.stat.exists

    - name: Save setup output locally
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ setup_output.stdout }}"
        dest: "{{ playbook_dir }}/setup-{{ inventory_hostname }}.out"
        mode: '0644'
      when: setup_script.stat.exists

    - name: Fail if setup script had errors
      ansible.builtin.fail:
        msg: "Setup script failed with return code {{ setup_output.rc }}"
      when:
        - setup_script.stat.exists
        - setup_output.rc != 0